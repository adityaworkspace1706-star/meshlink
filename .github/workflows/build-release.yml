name: Build & Release MeshLink

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── BUILD ANDROID APK ──────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (using gradle directly, no wrapper)
        run: |
          cd android
          gradle assembleDebug \
            -p . \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             MeshLink-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshLink-Android
          path: MeshLink-Android.apk

  # ── BUILD WINDOWS EXE ──────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build
        run: |
          cd electron
          npm install
          npm run build-win
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MeshLink-Windows
          path: electron/dist/MeshLink*.exe

  # ── BUILD MAC ──────────────────────────
  build-mac:
    name: Build Mac DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build
        run: |
          cd electron
          npm install
          npm run build-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MeshLink-Mac
          path: electron/dist/MeshLink*.dmg

  # ── CREATE RELEASE ─────────────────────
  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release with Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MeshLink v1.0.${{ github.run_number }}
          body: |
            # 📡 MeshLink — Offline Bluetooth Mesh Network

            ## Download & Install

            | Platform | Download | Steps |
            |----------|----------|-------|
            | 📱 **Android** | `MeshLink-Android.apk` | Download → open on phone → Install |
            | 🪟 **Windows** | `MeshLink-Setup.exe` | Download → run installer |
            | 🍎 **Mac** | `MeshLink.dmg` | Download → drag to Applications |

            ## Features
            - 🔵 Auto-discovers nearby devices via **Bluetooth BLE** — no pairing needed
            - 📶 Also works via **WiFi LAN** as fallback
            - 🔐 **AES-256-GCM** end-to-end encrypted messages
            - 📡 **Store-carry-forward** — messages delivered when device reconnects
            - ⚡ Zero internet · Zero server · Zero account

            ## Android Install Note
            > Settings → Security → **Allow install from unknown sources** → then open APK
          files: |
            dist/MeshLink-Android/MeshLink-Android.apk
            dist/MeshLink-Windows/MeshLink*.exe
            dist/MeshLink-Mac/MeshLink*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
